<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 jrp</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 登录页自己那一小块样式。不进 style.css —— 主页面的 12 个 script 不加载到这里，
     样式混进去也用不上，还容易跟主页面的类名撞。 */
  .login-wrap { max-width: 420px; margin: 64px auto; padding: 0 18px; text-align: center; }
  .login-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; }
  .login-card h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
  .login-card p.sub { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
  .qr-box { width: 220px; height: 220px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;
            background: var(--bg); border: 1px solid var(--line); border-radius: 10px; color: var(--muted); font-size: 13px; }
  .qr-box img { width: 220px; height: 220px; display: block; }
  .status { font-size: 14px; min-height: 22px; }
  .status.err { color: var(--bad); }
  .status.ok { color: var(--good); }
  .tip { margin-top: 18px; color: var(--muted); font-size: 12px; line-height: 1.7; }
  a.retry { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>登录 jrp</h1>
    <p class="sub">用微信扫一扫，在小程序里点「确认登录」</p>
    <div class="qr-box" id="qr"><span id="qrHint">正在生成二维码…</span></div>
    <div class="status" id="status">&nbsp;</div>
    <p class="tip" id="tip">
      二维码 5 分钟内有效。过期了 <a class="retry" href="#" id="retry">点这里换一张</a>。<br>
      手机上已经在小程序里了？直接在小程序里用就行，不用扫。
    </p>
  </div>
</div>
<script src="auth.js"></script>
<script>jrpAuth.boot()</script>
</body>
</html>
