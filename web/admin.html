<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · jrp</title>
<link rel="icon" href="favicon.ico?v=2">
<link rel="stylesheet" href="style.css">
<style>
  /* 管理后台自己那一小块。不进 style.css —— 主页面的 12 个 script 不加载到这里，
     样式混进去用不上，还容易跟主页面类名撞。 */
  .admin-wrap { max-width: 900px; margin: 40px auto; padding: 0 18px 60px; }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  p.sub { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; }
  .msg { min-height: 22px; font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  .msg.err { color: var(--bad); }

  /* 一眼扫完的摘要：几个账号、几个待批准 */
  .summary { font-size: 13px; color: var(--muted); margin: 0 0 10px; min-height: 20px; }
  .summary b { color: var(--ink); font-weight: 600; }
  .summary .n-pending { color: var(--unknown); }
  .summary .n-disabled { color: var(--muted); }
  .summary .tip { color: var(--muted); opacity: .85; }
  .logout { float: right; color: var(--muted); text-decoration: none; font-size: 13px; }
  .logout:hover { color: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  tr.pending { background: var(--unknown-soft); }
  tr.disabled td { color: var(--muted); }
  .empty { padding: 24px 0; color: var(--muted); font-size: 13px; text-align: center; }

  /* 顶部 tab：用户管理 / 用户行为 */
  .tabs { display: flex; gap: 6px; margin: 0 0 16px; border-bottom: 1px solid var(--line); }
  .tabs button { border: none; background: none; color: var(--muted); font-size: 14px;
                 padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  /* 用户行为报表：横向条形图（纯 div，不引外部图表库） */
  .abar { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 13px; }
  .abar .lbl { flex: 0 0 180px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .abar .bar { flex: 1 1 auto; background: var(--line); border-radius: 4px; height: 18px; position: relative; overflow: hidden; }
  .abar .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .abar .val { flex: 0 0 64px; text-align: right; color: var(--muted); white-space: nowrap; }
  .an-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin: 0 0 16px; }
  .an-card h2 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .an-card .sub { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
  .an-kv { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
  .an-kv b { color: var(--ink); font-weight: 600; }
  .an-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .an-tbl th, .an-tbl td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  .an-tbl th { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
  .an-tbl td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .an-row { display: flex; gap: 18px; flex-wrap: wrap; }
  .an-col { flex: 1 1 320px; min-width: 280px; }
  .an-toolbar { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 13px; color: var(--muted); }
  .an-toolbar select { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }

  .badge { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .r-owner { background: var(--accent-soft); color: var(--accent); }
  .r-member { background: var(--accent-soft); color: var(--accent); }
  .r-pending { background: var(--unknown-soft); color: var(--unknown); }
  .r-disabled { background: #efefec; color: var(--muted); }

  .act { white-space: nowrap; text-align: right; }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--ink);
         padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-left: 6px; }
  .btn:hover { border-color: var(--muted); }
  .btn.ok { border-color: var(--accent); color: var(--accent); }
  .btn.warn { border-color: var(--unknown); color: var(--unknown); }
  .btn.bad { border-color: var(--bad); color: var(--bad); }

  /* 未登录时摆的扫码框，跟 login.html 同一套结构（复用 auth.js） */
  #gate .gate-note { font-size: 13px; color: var(--unknown); text-align: center;
                     margin: 0 auto 14px; max-width: 420px; line-height: 1.6; }
  #gate .gate-note:empty { display: none; }
  #gate .qr-box { width: 200px; height: 200px; margin: 0 auto 14px; display: flex;
                  align-items: center; justify-content: center; background: var(--bg);
                  border: 1px solid var(--line); border-radius: 10px; color: var(--muted); font-size: 13px; }
  #gate .qr-box img { width: 200px; height: 200px; display: block; }
  #gate .status { font-size: 14px; min-height: 22px; text-align: center; }
  #gate .status.err { color: var(--bad); }
  #gate .status.ok { color: var(--good); }
  #gate a.retry { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
  .back { margin-top: 22px; font-size: 13px; }
  .back a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="admin-wrap">
  <h1>管理后台</h1>
  <p class="sub">
    审批新用户 · 冻结或删除账号
    <a href="#" id="logoutLink" class="logout">退出登录</a>
  </p>

  <!-- 1. 不是 owner（含没登录、没审核通过）一律回这里扫码 -->
  <div class="card" id="gate" style="display:none">
    <div class="gate-note" id="gateNote"></div>
    <div class="qr-box" id="qr"><span id="qrHint">正在生成二维码…</span></div>
    <div class="status" id="status">&nbsp;</div>
    <p class="sub" style="margin:12px 0 0">
      二维码 5 分钟内有效，过期了 <a class="retry" href="#" id="retry">点这里换一张</a>。
    </p>
  </div>

  <!-- 2. owner：用户表 + 用户行为 -->
  <div id="panel" style="display:none">
    <div class="tabs">
      <button id="tabUsers" class="on" data-tab="users">用户管理</button>
      <button id="tabAnalytics" data-tab="analytics">用户行为</button>
    </div>

    <!-- 用户管理 -->
    <div id="view-users">
      <div class="msg" id="msg"></div>
      <div class="summary" id="summary"></div>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>账号</th><th>微信尾号</th><th>状态</th><th>首次登录</th><th>最近登录</th><th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <!-- 用户行为 -->
    <div id="view-analytics" style="display:none">
      <div class="msg" id="aMsg"></div>
      <div class="an-toolbar">
        最近
        <select id="aDays">
          <option value="7">7 天</option>
          <option value="30" selected>30 天</option>
          <option value="90">90 天</option>
        </select>
        <span id="aMeta" class="muted"></span>
      </div>
      <div id="aBody"></div>
    </div>
  </div>

  <p class="back"><a href="/index.html">← 回到 jrp</a></p>
</div>
<script src="auth.js"></script>
<script src="admin.js"></script>
<script>jrpAdmin.boot()</script>
</body>
</html>
