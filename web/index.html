<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jrp 每日练习</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="top">
  <span class="brand">jrp</span>
  <nav>
    <button class="tab" data-page="practice">今日练习</button>
    <button class="tab" data-page="sentence">造句</button>
    <button class="tab" data-page="hard">钉子户</button>
    <button class="tab" data-page="offline">离线回填</button>
    <button class="tab" data-page="stats">统计</button>
    <button class="tab" data-page="lexicon">词汇总表</button>
  </nav>
  <span class="spacer"></span>
  <label class="grade-mode">
    视图
    <select id="viewMode">
      <option value="list" selected>列表</option>
      <option value="card">卡片</option>
    </select>
  </label>
  <label class="grade-mode">
    判分
    <select id="gradeMode">
      <option value="kana" selected>假名档</option>
      <option value="kanji">汉字档</option>
      <option value="full">完整档</option>
      <option value="either">任一档（假名/汉字都行）</option>
    </select>
  </label>
  <span id="today" class="muted"></span>
</header>

<div id="dryRunBanner" class="hidden">
  🚧 演练模式（服务端 --dry-run）：本次练习<b>不会</b>写入 COS，判分和版本号照常算，刷新即丢弃
</div>

<div id="tokenBar" class="hidden">
  <input id="tokenInput" type="password" placeholder="访问 token（服务端设了鉴权才需要）">
  <button id="tokenSave">保存</button>
  <span class="muted">token 存在本机 localStorage</span>
</div>

<main>
  <!-- 今日练习 -->
  <section id="page-practice" class="page">
    <div class="toprow">
      <div id="practiceSummary" class="summary"></div>
      <label class="nails"><input id="nailsOnly" type="checkbox"> 只练钉子户</label>
    </div>

    <!-- 列表模式 -->
    <div id="practiceList" class="hidden"></div>
    <div id="practiceBar" class="listbar hidden">
      <span id="practiceCount" class="muted"></span>
      <button id="practiceGrade" class="primary">对答案</button>
      <button id="practiceCommit" class="primary hidden">回写档案</button>
      <button id="practiceRequeue" class="ghost hidden">再练错词</button>
      <span id="practiceNote" class="muted"></span>
    </div>
    <div id="practiceMsg" class="feedback"></div>
    <div id="tomorrowBox"></div>

    <!-- 卡片模式 -->
    <div id="practiceCard" class="card hidden">
      <div class="card-head">
        <span id="wProgress" class="muted"></span>
        <span id="wStatus" class="tag"></span>
      </div>
      <div id="wDefinition" class="definition"></div>
      <input id="wInput" type="text" autocomplete="off" spellcheck="false" placeholder="写日语，回车提交">
      <div id="wFeedback" class="feedback"></div>
      <div class="row">
        <button id="wSubmit">提交</button>
        <button id="wUnknown" class="ghost">不会</button>
        <button id="wReveal" class="ghost">看答案</button>
        <button id="wSkip" class="ghost">跳过</button>
      </div>
    </div>
    <div id="practiceDone" class="hidden">
      <div id="practiceResult"></div>
      <button id="practiceCommitCard" class="primary">回写档案</button>
      <div id="commitResult" class="feedback"></div>
      <div id="tomorrowBoxCard"></div>
    </div>
  </section>

  <!-- 造句 -->
  <section id="page-sentence" class="page hidden">
    <div id="sentenceSummary" class="summary"></div>
    <div id="sentenceList"></div>
    <div id="sentenceDone" class="hidden">
      <button id="sentenceCommit" class="primary">回写造句结果</button>
      <div id="sentenceCommitResult" class="feedback"></div>
    </div>
  </section>

  <!-- 钉子户专项 -->
  <section id="page-hard" class="page hidden">
    <div class="toprow">
      <div id="hardSummary" class="summary"></div>
    </div>

    <!-- 列表模式 -->
    <div id="hardList" class="hidden"></div>
    <div id="hardBar" class="listbar hidden">
      <span id="hardCount" class="muted"></span>
      <button id="hardGrade" class="primary">对答案</button>
      <button id="hardCommit" class="primary hidden">回写档案</button>
      <button id="hardRequeue" class="ghost hidden">再练错词</button>
      <span id="hardNote" class="muted"></span>
    </div>
    <div id="hardMsg" class="feedback"></div>
    <div id="hardTomorrowBox"></div>

    <!-- 卡片模式 -->
    <div id="hardCard" class="card hidden">
      <div class="card-head">
        <span id="hProgress" class="muted"></span>
        <span id="hMeta" class="tag"></span>
      </div>
      <div id="hDefinition" class="definition"></div>
      <input id="hInput" type="text" autocomplete="off" spellcheck="false" placeholder="写日语，回车提交">
      <div id="hFeedback" class="feedback"></div>
      <div class="row">
        <button id="hSubmit">提交</button>
        <button id="hUnknown" class="ghost">不会</button>
        <button id="hReveal" class="ghost">看答案</button>
        <button id="hSkip" class="ghost">跳过</button>
      </div>
    </div>
    <div id="hardDone" class="hidden">
      <button id="hardCommitCard" class="primary">回写档案</button>
      <div id="hardCommitResult" class="feedback"></div>
    </div>
  </section>

  <!-- 离线回填 -->
  <section id="page-offline" class="page hidden">
    <div class="card">
      <h3>导出离线练习包</h3>
      <div class="row">
        <label>日期 <input id="exportDate" type="date"></label>
        <label>类型
          <select id="exportMode">
            <option value="daily">单词 + 造句</option>
            <option value="hard">钉子户专项</option>
            <option value="sentences">纯造句（50 句）</option>
          </select>
        </label>
        <button id="exportBtn" class="primary">下载 xlsx</button>
      </div>
      <p class="muted">文件里藏了 plan_date，隔天再回填也能对上号。用 WPS/Excel 打开填写日语列。</p>
    </div>

    <div class="card">
      <h3>上传填好的 xlsx</h3>
      <div class="row">
        <input id="importFile" type="file" accept=".xlsx">
        <button id="importBtn">解析</button>
      </div>
      <div id="importInfo" class="feedback"></div>
      <div id="importWords"></div>
      <div id="importSentences"></div>
      <button id="importCommit" class="primary hidden">确认提交</button>
      <div id="importCommitResult" class="feedback"></div>
    </div>
  </section>

  <!-- 统计 -->
  <section id="page-stats" class="page hidden">
    <div class="row">
      <label>最近 <select id="statsDays">
        <option value="7">7 天</option>
        <option value="30" selected>30 天</option>
        <option value="90">90 天</option>
      </select></label>
    </div>
    <div id="statsBody"></div>
  </section>

  <!-- 词汇总表：全部词一览，看着复习用，不答题 -->
  <section id="page-lexicon" class="page hidden">
    <div class="lexbar">
      <input id="lexSearch" type="text" autocomplete="off" placeholder="搜假名 / 汉字 / 中文">
      <select id="lexPos"></select>
      <select id="lexStatus"></select>
      <select id="lexGroup"></select>
      <label class="muted"><input id="lexWrongOnly" type="checkbox"> 只看错过</label>
      <span id="lexCount" class="muted"></span>
    </div>
    <div id="lexSummary" class="summary"></div>
    <div id="lexBody"></div>
  </section>
</main>

<div id="toast" class="hidden"></div>

<script src="grade.js"></script>
<script src="app.js"></script>
<script src="unknown.js"></script>
<script src="list.js"></script>
<script src="practice.js"></script>
<script src="sentence.js"></script>
<script src="hard.js"></script>
<script src="offline.js"></script>
<script src="chart.js"></script>
<script src="stats.js"></script>
<script src="lexicon.js"></script>
<script>app.boot()</script>
</body>
</html>
